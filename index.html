<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Cosmos Math — VR Space Academy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cosmos-dark: #020817;
      --cosmos-deep: #050e24;
      --cosmos-blue: #0a1628;
      --neon-cyan: #00f5ff;
      --neon-purple: #bf5fff;
      --neon-gold: #ffd700;
      --neon-green: #39ff14;
      --star-white: #e8f4f8;
      --text-dim: #7ab8cc;
    }

    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Exo 2', sans-serif;
      background: var(--cosmos-dark);
      cursor: none;
    }

    /* Custom cursor */
    .cursor {
      position: fixed;
      width: 20px; height: 20px;
      border: 2px solid var(--neon-cyan);
      border-radius: 50%;
      pointer-events: none;
      z-index: 99999;
      transform: translate(-50%, -50%);
      transition: width 0.2s, height 0.2s, border-color 0.2s;
      mix-blend-mode: screen;
    }
    .cursor::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 4px; height: 4px;
      background: var(--neon-cyan);
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    /* ——— LAUNCH SCREEN ——— */
    #launchScreen {
      position: fixed;
      inset: 0;
      background: var(--cosmos-dark);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Star field canvas behind everything */
    #starCanvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .launch-content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      text-align: center;
      padding: 40px 20px;
    }

    .planet-ring {
      position: relative;
      width: 180px;
      height: 180px;
      margin-bottom: 24px;
      animation: float 6s ease-in-out infinite;
    }

    .planet {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #2a6496, #0d1f4a 60%, #020817);
      box-shadow:
        0 0 40px rgba(0,245,255,0.3),
        0 0 80px rgba(0,245,255,0.15),
        inset -20px -10px 40px rgba(0,0,0,0.6);
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
    }
    .planet::after {
      content: '';
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%,
        rgba(255,255,255,0.15) 0%,
        transparent 60%);
    }

    .orbit-ring {
      position: absolute;
      top: 50%; left: 50%;
      width: 170px; height: 50px;
      border: 2px solid rgba(0,245,255,0.3);
      border-radius: 50%;
      transform: translate(-50%, -50%) rotateX(75deg);
      animation: orbit-spin 8s linear infinite;
      box-shadow: 0 0 20px rgba(0,245,255,0.2);
    }

    .orbit-dot {
      position: absolute;
      width: 10px; height: 10px;
      background: var(--neon-cyan);
      border-radius: 50%;
      top: -5px; left: calc(50% - 5px);
      box-shadow: 0 0 15px var(--neon-cyan), 0 0 30px var(--neon-cyan);
    }

    @keyframes orbit-spin {
      from { transform: translate(-50%, -50%) rotateX(75deg) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotateX(75deg) rotate(360deg); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-15px); }
    }

    .game-logo {
      font-family: 'Orbitron', monospace;
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 900;
      color: var(--star-white);
      letter-spacing: 0.1em;
      line-height: 1;
      text-shadow:
        0 0 20px var(--neon-cyan),
        0 0 60px rgba(0,245,255,0.4);
      margin-bottom: 4px;
    }

    .game-logo span {
      color: var(--neon-cyan);
    }

    .game-subtitle {
      font-family: 'Exo 2', sans-serif;
      font-size: 0.9rem;
      font-weight: 300;
      color: var(--text-dim);
      letter-spacing: 0.5em;
      text-transform: uppercase;
      margin-bottom: 40px;
    }

    .input-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 100%;
      max-width: 380px;
    }

    .input-label {
      font-family: 'Orbitron', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      color: var(--neon-cyan);
      text-transform: uppercase;
      align-self: flex-start;
    }

    .cosmo-input {
      width: 100%;
      padding: 14px 20px;
      background: rgba(0,245,255,0.05);
      border: 1px solid rgba(0,245,255,0.3);
      border-radius: 4px;
      color: var(--star-white);
      font-family: 'Orbitron', monospace;
      font-size: 1rem;
      outline: none;
      transition: all 0.3s;
      letter-spacing: 0.05em;
    }
    .cosmo-input::placeholder { color: rgba(255,255,255,0.2); }
    .cosmo-input:focus {
      border-color: var(--neon-cyan);
      background: rgba(0,245,255,0.08);
      box-shadow: 0 0 20px rgba(0,245,255,0.2);
    }

    .launch-btn {
      width: 100%;
      padding: 16px;
      background: transparent;
      border: 2px solid var(--neon-cyan);
      border-radius: 4px;
      color: var(--neon-cyan);
      font-family: 'Orbitron', monospace;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      cursor: none;
      position: relative;
      overflow: hidden;
      transition: all 0.3s;
    }
    .launch-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--neon-cyan);
      transform: translateX(-100%);
      transition: transform 0.4s ease;
      z-index: -1;
    }
    .launch-btn:hover::before { transform: translateX(0); }
    .launch-btn:hover {
      color: var(--cosmos-dark);
      box-shadow: 0 0 30px rgba(0,245,255,0.5);
    }

    .launch-btn:active { transform: scale(0.98); }

    /* Nebula decorations */
    .nebula {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 1;
    }
    .nebula-1 {
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(191,95,255,0.12) 0%, transparent 70%);
      top: -200px; right: -200px;
      animation: nebula-pulse 10s ease-in-out infinite alternate;
    }
    .nebula-2 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(0,245,255,0.08) 0%, transparent 70%);
      bottom: -150px; left: -150px;
      animation: nebula-pulse 14s ease-in-out infinite alternate-reverse;
    }
    .nebula-3 {
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(255,215,0,0.06) 0%, transparent 70%);
      top: 40%; left: 20%;
      animation: nebula-pulse 8s ease-in-out infinite alternate;
    }

    @keyframes nebula-pulse {
      from { opacity: 0.5; transform: scale(1); }
      to { opacity: 1; transform: scale(1.2); }
    }

    /* Grid lines */
    .grid-overlay {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(0,245,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,245,255,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    /* HUD corners */
    .hud-corner {
      position: fixed;
      width: 40px; height: 40px;
      z-index: 15;
      pointer-events: none;
    }
    .hud-corner::before, .hud-corner::after {
      content: '';
      position: absolute;
      background: var(--neon-cyan);
    }
    .hud-corner::before { width: 2px; height: 30px; }
    .hud-corner::after { width: 30px; height: 2px; }
    .hud-tl { top: 20px; left: 20px; }
    .hud-tr { top: 20px; right: 20px; transform: scaleX(-1); }
    .hud-bl { bottom: 20px; left: 20px; transform: scaleY(-1); }
    .hud-br { bottom: 20px; right: 20px; transform: scale(-1); }

    /* VR button */
    #vrBtn {
      position: fixed;
      bottom: 30px;
      right: 30px;
      padding: 12px 24px;
      background: rgba(0,245,255,0.1);
      border: 1px solid rgba(0,245,255,0.5);
      border-radius: 4px;
      color: var(--neon-cyan);
      font-family: 'Orbitron', monospace;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      cursor: none;
      z-index: 9999;
      display: none;
      transition: all 0.3s;
    }
    #vrBtn:hover {
      background: rgba(0,245,255,0.2);
      box-shadow: 0 0 20px rgba(0,245,255,0.3);
    }

    /* Scan line effect */
    #launchScreen::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.03) 2px,
        rgba(0,0,0,0.03) 4px
      );
      pointer-events: none;
      z-index: 20;
    }
  </style>
</head>
<body>

  <div class="cursor" id="cursor"></div>
  <canvas id="starCanvas"></canvas>

  <!-- Ambient nebula glows -->
  <div class="nebula nebula-1"></div>
  <div class="nebula nebula-2"></div>
  <div class="nebula nebula-3"></div>
  <div class="grid-overlay"></div>

  <!-- HUD corners -->
  <div class="hud-corner hud-tl"></div>
  <div class="hud-corner hud-tr"></div>
  <div class="hud-corner hud-bl"></div>
  <div class="hud-corner hud-br"></div>

  <!-- ===== LAUNCH SCREEN ===== -->
  <div id="launchScreen">
    <div class="launch-content">
      <div class="planet-ring">
        <div class="orbit-ring"><div class="orbit-dot"></div></div>
        <div class="planet"></div>
      </div>

      <h1 class="game-logo">COSMOS<span> MATH</span></h1>
      <p class="game-subtitle">VR Space Academy</p>

      <div class="input-section">
        <span class="input-label">▸ Cadet Identifier</span>
        <input class="cosmo-input" type="text" id="playerNameInput" placeholder="Enter your name..." maxlength="20" autocomplete="off">
        <button class="launch-btn" onclick="startApp()">⬡ Launch Mission</button>
      </div>
    </div>
  </div>

  <!-- VR button -->
  <button id="vrBtn" onclick="enterVR()">⬡ Enter VR</button>

  <!-- ===== A-FRAME SCENE ===== -->
  <a-scene id="mainScene" background="color: #010914" vr-mode-ui="enabled: false">

    <!-- Stars: dense particle field -->
    <a-entity id="stars"></a-entity>

    <!-- Space environment: deep navy sky + distant nebula colors -->
    <a-sky color="#010914"></a-sky>

    <!-- Ambient + directional lighting -->
    <a-light type="ambient" color="#0a1a3a" intensity="0.8"></a-light>
    <a-light type="directional" color="#00aaff" intensity="0.6" position="1 3 -1"></a-light>
    <a-light type="point" color="#bf5fff" intensity="0.4" position="-3 2 -5"></a-light>

    <!-- Saturn-like planet in background (right) -->
    <a-sphere position="8 3 -15" radius="2.5"
      material="color:#1a3a6a; emissive:#0a1f3a; emissiveIntensity:0.3; roughness:0.8; metalness:0.1">
    </a-sphere>
    <a-torus position="8 3 -15" radius="3.5" radius-tubular="0.12"
      rotation="75 0 15"
      material="color:#3a6a9a; emissive:#1a3a6a; emissiveIntensity:0.2; opacity:0.7; transparent:true">
    </a-torus>

    <!-- Distant red/orange giant (left) -->
    <a-sphere position="-10 6 -20" radius="3"
      material="color:#6a1a0a; emissive:#ff4400; emissiveIntensity:0.5; roughness:1">
    </a-sphere>
    <!-- Glow halo -->
    <a-sphere position="-10 6 -20" radius="3.8"
      material="color:#ff6600; emissive:#ff4400; emissiveIntensity:0.15; opacity:0.15; transparent:true">
    </a-sphere>

    <!-- Moon/asteroid -->
    <a-sphere position="5 -2 -10" radius="0.6"
      material="color:#3a3a4a; roughness:1; metalness:0">
    </a-sphere>

    <!-- Floating asteroids -->
    <a-dodecahedron position="-6 1 -8" radius="0.4"
      material="color:#2a2a3a; roughness:1"
      animation="property:rotation; to: 360 360 0; loop:true; dur:12000; easing:linear">
    </a-dodecahedron>
    <a-dodecahedron position="7 -1 -7" radius="0.3"
      material="color:#3a3040; roughness:1"
      animation="property:rotation; to: -360 180 360; loop:true; dur:9000; easing:linear">
    </a-dodecahedron>

    <!-- Nebula cloud panels (translucent) -->
    <a-plane position="-5 4 -18" width="12" height="8"
      material="src: #nebulaGrad; opacity:0.12; transparent:true; side:double"
      rotation="0 25 0">
    </a-plane>

    <!-- Camera with gaze cursor -->
    <a-entity camera look-controls wasd-controls="enabled:false" position="0 1.6 0">
      <a-entity
        cursor="fuse:true; fuseTimeout:1800"
        position="0 0 -1"
        geometry="primitive:ring; radiusInner:0.018; radiusOuter:0.028"
        material="color:#00f5ff; shader:flat; opacity:0.8"
        animation__fusing="property:scale; startEvents:fusing; from:1 1 1; to:0.2 0.2 0.2; dur:1800"
        animation__click="property:scale; startEvents:click; from:0.2 0.2 0.2; to:1 1 1; dur:200"
        raycaster="objects:.clickable">
      </a-entity>
    </a-entity>

    <!-- ===== UI PANELS ===== -->

    <!-- Welcome text -->
    <a-entity id="welcomePanel" position="0 2.2 -3.5">
      <a-plane width="4" height="0.8"
        material="color:#00f5ff; emissive:#00f5ff; emissiveIntensity:0.05; opacity:0.08; transparent:true">
      </a-plane>
      <a-text id="welcomeText" value="COSMOS MATH" align="center" color="#00f5ff"
        font="https://cdn.aframe.io/fonts/Exo2Bold.fnt"
        width="5" position="0 0 0.05">
      </a-text>
    </a-entity>

    <!-- START button -->
    <a-entity id="startButton" class="clickable"
      geometry="primitive:box; height:0.5; width:2; depth:0.05"
      position="0 1.2 -3.5"
      material="color:#00f5ff; emissive:#00f5ff; emissiveIntensity:0.25; opacity:0.15; transparent:true"
      onclick="startGame()"
      animation__hover="property:material.emissiveIntensity; to:0.5; startEvents:mouseenter; dur:300"
      animation__unhover="property:material.emissiveIntensity; to:0.25; startEvents:mouseleave; dur:300">
      <a-text value="▸ BEGIN MISSION" color="#00f5ff" align="center" position="0 0 0.06" width="5"
        font="https://cdn.aframe.io/fonts/Exo2Bold.fnt">
      </a-text>
      <!-- Border glow lines -->
      <a-entity geometry="primitive:box; height:0.51; width:2.01; depth:0.04"
        material="wireframe:true; color:#00f5ff; opacity:0.4; transparent:true">
      </a-entity>
    </a-entity>

    <!-- Grade buttons -->
    <a-entity id="grade1Btn" visible="false" class="clickable"
      geometry="primitive:box; height:0.55; width:1.8; depth:0.05"
      position="-1.2 1.2 -3.5"
      material="color:#bf5fff; emissive:#bf5fff; emissiveIntensity:0.2; opacity:0.15; transparent:true"
      onclick="selectGrade(1)"
      animation__hover="property:material.emissiveIntensity; to:0.5; startEvents:mouseenter; dur:300"
      animation__unhover="property:material.emissiveIntensity; to:0.2; startEvents:mouseleave; dur:300">
      <a-text value="◈ GRADE 1\nBasic Ops" color="#bf5fff" align="center" position="0 0 0.06" width="4.5"
        font="https://cdn.aframe.io/fonts/Exo2Bold.fnt">
      </a-text>
      <a-entity geometry="primitive:box; height:0.56; width:1.81; depth:0.04"
        material="wireframe:true; color:#bf5fff; opacity:0.4; transparent:true">
      </a-entity>
    </a-entity>

    <a-entity id="grade2Btn" visible="false" class="clickable"
      geometry="primitive:box; height:0.55; width:1.8; depth:0.05"
      position="1.2 1.2 -3.5"
      material="color:#ffd700; emissive:#ffd700; emissiveIntensity:0.2; opacity:0.12; transparent:true"
      onclick="selectGrade(2)"
      animation__hover="property:material.emissiveIntensity; to:0.5; startEvents:mouseenter; dur:300"
      animation__unhover="property:material.emissiveIntensity; to:0.2; startEvents:mouseleave; dur:300">
      <a-text value="◈ GRADE 2\nAdvanced Ops" color="#ffd700" align="center" position="0 0 0.06" width="4.5"
        font="https://cdn.aframe.io/fonts/Exo2Bold.fnt">
      </a-text>
      <a-entity geometry="primitive:box; height:0.56; width:1.81; depth:0.04"
        material="wireframe:true; color:#ffd700; opacity:0.4; transparent:true">
      </a-entity>
    </a-entity>

    <!-- Question display -->
    <a-entity id="questionPanel" visible="false" position="0 2.3 -3.5">
      <a-plane width="4.5" height="0.9"
        material="color:#0a1628; emissive:#00f5ff; emissiveIntensity:0.04; opacity:0.85; transparent:true">
      </a-plane>
      <a-entity geometry="primitive:box; height:0.92; width:4.52; depth:0.02"
        material="wireframe:true; color:#00f5ff; opacity:0.3; transparent:true">
      </a-entity>
      <a-text id="questionText" value="" align="center" color="#00f5ff"
        font="https://cdn.aframe.io/fonts/Exo2Bold.fnt"
        width="6" position="0 0 0.06">
      </a-text>
    </a-entity>

    <!-- Answer options -->
    <a-entity id="option1" visible="false" class="clickable"
      geometry="primitive:box; height:0.55; width:1.2; depth:0.05"
      position="-1.6 1.2 -3.5"
      material="color:#ff6b35; emissive:#ff6b35; emissiveIntensity:0.2; opacity:0.15; transparent:true"
      onclick="selectAnswer(0)"
      animation__hover="property:material.emissiveIntensity; to:0.6; startEvents:mouseenter; dur:300"
      animation__unhover="property:material.emissiveIntensity; to:0.2; startEvents:mouseleave; dur:300">
      <a-text id="text1" value="" color="#ff6b35" align="center" position="0 0 0.06" width="4"
        font="https://cdn.aframe.io/fonts/Exo2Bold.fnt">
      </a-text>
      <a-entity geometry="primitive:box; height:0.56; width:1.21; depth:0.04"
        material="wireframe:true; color:#ff6b35; opacity:0.5; transparent:true">
      </a-entity>
    </a-entity>

    <a-entity id="option2" visible="false" class="clickable"
      geometry="primitive:box; height:0.55; width:1.2; depth:0.05"
      position="0 1.2 -3.5"
      material="color:#00f5ff; emissive:#00f5ff; emissiveIntensity:0.2; opacity:0.15; transparent:true"
      onclick="selectAnswer(1)"
      animation__hover="property:material.emissiveIntensity; to:0.6; startEvents:mouseenter; dur:300"
      animation__unhover="property:material.emissiveIntensity; to:0.2; startEvents:mouseleave; dur:300">
      <a-text id="text2" value="" color="#00f5ff" align="center" position="0 0 0.06" width="4"
        font="https://cdn.aframe.io/fonts/Exo2Bold.fnt">
      </a-text>
      <a-entity geometry="primitive:box; height:0.56; width:1.21; depth:0.04"
        material="wireframe:true; color:#00f5ff; opacity:0.5; transparent:true">
      </a-entity>
    </a-entity>

    <a-entity id="option3" visible="false" class="clickable"
      geometry="primitive:box; height:0.55; width:1.2; depth:0.05"
      position="1.6 1.2 -3.5"
      material="color:#bf5fff; emissive:#bf5fff; emissiveIntensity:0.2; opacity:0.15; transparent:true"
      onclick="selectAnswer(2)"
      animation__hover="property:material.emissiveIntensity; to:0.6; startEvents:mouseenter; dur:300"
      animation__unhover="property:material.emissiveIntensity; to:0.2; startEvents:mouseleave; dur:300">
      <a-text id="text3" value="" color="#bf5fff" align="center" position="0 0 0.06" width="4"
        font="https://cdn.aframe.io/fonts/Exo2Bold.fnt">
      </a-text>
      <a-entity geometry="primitive:box; height:0.56; width:1.21; depth:0.04"
        material="wireframe:true; color:#bf5fff; opacity:0.5; transparent:true">
      </a-entity>
    </a-entity>

    <!-- Feedback text (correct/wrong) -->
    <a-text id="feedbackText" value="" align="center" color="#39ff14"
      font="https://cdn.aframe.io/fonts/Exo2Bold.fnt"
      width="5" position="0 0.4 -3.5" visible="false">
    </a-text>

  </a-scene>

  <script src="script.js"></script>
</body>
</html>
